name: amit_porfolio
description: Premium Flutter Portfolio for Amit Kumar - Senior Flutter Developer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.9
  get: ^4.7.3
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  lottie: ^3.5.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  share_plus: ^13.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/resume/
